name: Security scan

on:
  push:
    branches: [main]
  schedule:
    # Every Monday 06:00 UTC — catches dependencies/domains that go bad
    # between pushes (the polyfill.io scenario)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies (OSV/PyPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export pinned dependency list from uv.lock
        run: uv export --no-hashes --no-emit-project -o requirements-audit.txt
      - name: Audit against PyPA advisory database
        run: uvx pip-audit --no-deps -r requirements-audit.txt

  external-resources:
    name: Check externally-hosted resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install social-card image libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev zlib1g-dev
      - name: Build site (so theme-injected resources are scanned)
        run: uv run mkdocs build
      - name: Allowlist + URLhaus check
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: uv run python scripts/check_external_resources.py
